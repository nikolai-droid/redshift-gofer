# Keeps the free Render instance awake.
#
# Render shuts a free web service down after 15 minutes without inbound
# traffic. This job pings the health endpoint every 10 minutes, which is
# free on public repositories (unlimited GitHub Actions minutes) and
# cheap on private ones.
name: keepalive
on:
  schedule:
    # Every 10 minutes. GitHub runs scheduled jobs at roughly this time.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the bot
        run: |
          curl -fsS --max-time 20 "$HEALTH_URL" && echo " — awake"
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
